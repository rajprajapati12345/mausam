<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mausam — Your Weather. Your World.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E88E5">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mausam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F9FF;
  --primary:#2196F3;
  --primary-dark:#1877C9;
  --navy:#0B1F3A;
  --card:#FFFFFF;
  --secondary:#64B5F6;
  --success:#22C55E;
  --success-soft:#E7F9EE;
  --warning:#F59E0B;
  --warning-soft:#FFF4E1;
  --danger:#EF4444;
  --danger-soft:#FDEAEA;
  --info-soft:#E9F4FE;
  --text:#172033;
  --muted:#6B7A90;
  --border:#E4EDF7;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter','Noto Sans Devanagari',sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
.icon{width:1em;height:1em;display:inline-block;vertical-align:middle;}
svg.icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
}
.view{display:none;}
.view.active{display:flex; flex-direction:column; flex:1;}

/* ============ SPLASH ============ */
#view-splash{
  min-height:100vh;
  background:linear-gradient(180deg,#1E88E5 0%,#4FA8EA 38%,#BFE3FB 75%,#EAF6FF 100%);
  color:#fff;
  padding:64px 32px 40px;
  align-items:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.splash-scene{position:absolute; inset:auto 0 0 0; height:230px; pointer-events:none;}
.splash-mark{margin-top:28px;}
.splash-mark .word{font-size:34px; font-weight:800; letter-spacing:-0.02em;}
.splash-mark .tag{font-size:14.5px; opacity:0.92; margin-top:8px;}
.splash-copy{font-size:14px; line-height:1.6; opacity:0.9; max-width:30ch; margin:22px auto 0;}
.splash-actions{margin-top:auto; width:100%; position:relative; z-index:2; padding-top:220px;}
.btn-primary{
  width:100%; background:#fff; color:var(--primary-dark); border:none;
  border-radius:100px; padding:16px 18px; font-size:15.5px; font-weight:700;
  cursor:pointer;
}
.btn-ghost-white{
  width:100%; background:transparent; color:#fff; border:none;
  padding:14px 18px; font-size:14px; font-weight:600; cursor:pointer;
}

/* ============ SHARED SCREEN CHROME ============ */
.screen-pad{padding:20px 20px 100px;}
.top-back{
  display:flex; align-items:center; gap:10px; padding:18px 20px 4px;
}
.circle-btn{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--border);
  background:var(--card); display:flex; align-items:center; justify-content:center;
  color:var(--navy); cursor:pointer;
}
.circle-btn:hover{border-color:var(--primary);}

/* ============ ONBOARDING ============ */
#view-onboarding .screen-pad{padding-top:26px;}
.ob-title{font-size:24px; font-weight:800; color:var(--navy); margin:18px 0 4px;}
.ob-sub{font-size:13.5px; color:var(--muted); margin:0 0 22px;}
.interest-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.interest-tile{
  background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius-md);
  padding:18px 14px; text-align:left; cursor:pointer;
  display:flex; flex-direction:column; gap:10px;
  transition:border-color .15s, transform .1s;
}
.interest-tile:hover{transform:translateY(-1px); border-color:var(--primary);}
.tile-icon-chip{
  width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px;
}
.interest-tile .t-label{font-size:14px; font-weight:700; color:var(--navy);}
.interest-tile .t-desc{font-size:11.5px; color:var(--muted); line-height:1.4;}

/* ============ LOCATION ============ */
.loc-map{
  height:190px; border-radius:var(--radius-lg); margin:8px 0 24px;
  background:
    radial-gradient(circle at 30% 30%, #EAF4FE 0, #EAF4FE 40%, transparent 41%),
    repeating-linear-gradient(0deg, #E4EDF7 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, #E4EDF7 0 1px, transparent 1px 34px),
    #F7FBFF;
  position:relative; overflow:hidden; border:1px solid var(--border);
}
.loc-map .pin{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-100%);
  color:var(--primary); width:34px; height:34px;
}
.loc-title{font-size:22px; font-weight:800; color:var(--navy); margin:4px 0 6px;}
.loc-sub{font-size:13.5px; color:var(--muted); margin:0 0 22px; line-height:1.5;}
.btn-secondary-outline{
  width:100%; background:var(--card); color:var(--primary-dark); border:1.5px solid var(--primary);
  border-radius:100px; padding:14px 18px; font-size:14.5px; font-weight:700; cursor:pointer;
}
.divider-row{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:18px 0;}
.divider-row::before, .divider-row::after{content:""; flex:1; height:1px; background:var(--border);}
.search-input{
  width:100%; padding:14px 16px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
  font-size:14.5px; background:var(--card); color:var(--text);
}
.search-input:focus{outline:none; border-color:var(--primary);}
.suggestions{margin-top:8px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--card); overflow:hidden; display:none;}
.suggestions.show{display:block;}
.suggestion-item{padding:13px 16px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--border);}
.suggestion-item:last-child{border-bottom:none;}
.suggestion-item:hover{background:var(--info-soft);}
.suggestion-item .place{font-weight:600; color:var(--navy);}
.suggestion-item .region{color:var(--muted); font-size:12px;}
.status-msg{font-size:13px; color:var(--danger); margin-top:14px; line-height:1.5; display:none;}
.status-msg.show{display:block;}
.env-banner{
  display:none; background:var(--warning-soft); border:1px solid var(--warning); border-radius:var(--radius-sm);
  padding:12px 14px; font-size:12.5px; line-height:1.5; color:#7A5209; margin-bottom:20px;
}
.env-banner.show{display:block;}

/* ============ APP SHELL / NAV ============ */
#view-app{padding-bottom:0;}
.app-topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px 20px 8px; position:sticky; top:0; z-index:15; background:var(--bg);
}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
.greeting{min-width:0;}
.greeting .place span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.avatar-btn{
  width:42px; height:42px; border-radius:50%; flex:none; cursor:pointer;
  border:1.5px solid var(--primary); background:var(--info-soft); color:var(--primary-dark);
  display:flex; align-items:center; justify-content:center;
}
.avatar-btn svg{width:21px; height:21px;}
.avatar-btn:hover{background:#DCEEFD;}
.icon-btn{position:relative; width:42px; height:42px;}
.icon-btn svg{width:20px; height:20px;}
.bell-badge{
  position:absolute; top:-4px; right:-4px; min-width:19px; height:19px; padding:0 5px;
  border-radius:10px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}
.bell-badge.advisory{background:var(--warning);}
.avatar-btn:focus-visible, .circle-btn:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}

/* ============ SIDE SHEETS (profile left, alerts right) ============ */
.sheet-layer{position:fixed; inset:0; z-index:60; visibility:hidden; transition:visibility 0s .28s;}
.sheet-layer.open{visibility:visible; transition:none;}
.sheet-backdrop{position:absolute; inset:0; background:rgba(11,31,58,0.38); opacity:0; transition:opacity .28s;}
.sheet-layer.open .sheet-backdrop{opacity:1;}
.sheet-frame{position:relative; max-width:460px; height:100%; margin:0 auto; overflow:hidden; pointer-events:none;}
.sheet{
  position:absolute; top:0; bottom:0; width:min(88%,400px); background:var(--bg);
  display:flex; flex-direction:column; pointer-events:auto;
  transition:transform .28s cubic-bezier(.2,.8,.2,1); box-shadow:0 10px 40px rgba(11,31,58,0.18);
}
.sheet.left{left:0; transform:translateX(-104%); border-radius:0 20px 20px 0;}
.sheet.right{right:0; transform:translateX(104%); border-radius:20px 0 0 20px;}
.sheet-layer.open .sheet{transform:none;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px;}
.sheet-head h2{margin:0; font-size:18px; font-weight:800; color:var(--navy);}
.sheet-body{flex:1; overflow-y:auto; padding:0 20px 28px; -webkit-overflow-scrolling:touch;}
.sheet-body > div > .section-title:first-child{margin-top:12px;}
@media (prefers-reduced-motion:reduce){ .sheet, .sheet-backdrop{transition:none;} }
.greeting .hi{font-size:12.5px; color:var(--muted);}
.greeting .place{font-size:18px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:6px;}
.topbar-actions{display:flex; gap:8px;}
.nav-screen{display:none; flex:1; padding:12px 20px 32px;}
.nav-screen.active{display:block;}


/* ============ CARDS ============ */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(11,31,58,0.04);
}
.section-title{font-size:13.5px; font-weight:700; color:var(--navy); margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title .see-all{margin-left:auto; font-size:12px; color:var(--primary); font-weight:600; cursor:pointer;}

/* Hero */
.hero-card{
  background:linear-gradient(135deg,var(--primary) 0%, #4FA8EA 100%); color:#fff; border:none;
}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start;}
.hero-cond{font-size:13.5px; opacity:.92; display:flex; align-items:center; gap:6px;}
.hero-cond svg{width:16px; height:16px;}
.hero-temp{font-size:56px; font-weight:800; line-height:1; margin:14px 0 2px;}
.hero-desc{font-size:14.5px; font-weight:600; opacity:.95;}
.hero-feels{font-size:12.5px; opacity:.85; margin-top:2px;}
.hero-icon-big{width:56px; height:56px; opacity:.95;}
.hero-stats{display:flex; gap:18px; margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.28);}
.hero-stat{display:flex; flex-direction:column; gap:3px;}
.hero-stat .hs-label{font-size:10.5px; opacity:.8;}
.hero-stat .hs-value{font-size:14px; font-weight:700; display:flex; align-items:center; gap:5px;}
.hero-stat svg{width:14px; height:14px;}

/* Ring gauge score card */
.score-card{display:flex; align-items:center; gap:18px;}
.ring-wrap{position:relative; width:104px; height:104px; flex:none;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-center .rv{font-size:22px; font-weight:800; color:var(--navy); font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace;}
.ring-center .rv small{font-size:11px; font-weight:600; color:var(--muted);}
.score-copy .sc-label{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:4px;}
.score-copy h3{font-size:16px; font-weight:700; color:var(--navy); margin:0 0 6px;}
.score-copy p{font-size:12.5px; color:var(--muted); margin:0; line-height:1.5;}

/* Notification / alert cards */
.notif-card{display:flex; gap:12px; align-items:flex-start; border-left:4px solid var(--primary); background:var(--info-soft);}
.notif-card.tone-warning{border-left-color:var(--danger); background:var(--danger-soft);}
.notif-card.tone-advisory{border-left-color:var(--warning); background:var(--warning-soft);}
.notif-card.tone-good{border-left-color:var(--success); background:var(--success-soft);}
.notif-icon{
  width:36px; height:36px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center;
  color:var(--primary); flex:none;
}
.notif-card.tone-warning .notif-icon{color:var(--danger);}
.notif-card.tone-advisory .notif-icon{color:var(--warning);}
.notif-card.tone-good .notif-icon{color:var(--success);}
.notif-icon svg{width:18px; height:18px;}
.notif-body h4{font-size:14px; font-weight:700; color:var(--navy); margin:0 0 4px;}
.notif-body p{font-size:12.5px; color:#3B4A5E; margin:0; line-height:1.5;}
.notif-tag{display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:4px;}

/* Stat tiles */
.tile-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.tile{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;}
.tile .t-top{display:flex; align-items:center; gap:8px; color:var(--primary); margin-bottom:10px;}
.tile .t-top svg{width:17px; height:17px;}
.tile .t-top span{font-size:11.5px; color:var(--muted); font-weight:600;}
.tile .t-val{font-size:19px; font-weight:800; color:var(--navy); font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace;}
.tile .t-val .unit{font-size:11px; font-weight:600; color:var(--muted); margin-left:2px;}
.tile .t-sub{font-size:11px; color:var(--muted); margin-top:3px;}

/* Chips (suitability) */
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
.chip{
  display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:100px; font-size:12px; font-weight:600;
  background:var(--success-soft); color:#166534;
}
.chip.caution{background:var(--warning-soft); color:#92600A;}
.chip.avoid{background:var(--danger-soft); color:#9F1D1D;}
.chip svg{width:13px; height:13px;}

/* Gauges (arc speedometer) */
.gauge-row{display:flex; gap:12px;}
.gauge-card{flex:1; text-align:center;}
.gauge-svg-wrap{position:relative; width:100%; max-width:170px; margin:0 auto;}
.gauge-readout{position:absolute; left:0; right:0; top:58%; text-align:center;}
.gauge-readout .gv{font-size:20px; font-weight:800; color:var(--navy); font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace;}
.gauge-readout .gl{font-size:11px; font-weight:700; margin-top:1px;}
.gauge-minmax{display:flex; justify-content:space-between; font-size:10px; color:var(--muted); padding:0 6px; margin-top:-6px;}
.gauge-title{font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:2px;}

/* Hourly forecast (home) */
.fc-card{padding:16px 0 12px;}
.fc-head{padding:0 18px 10px; font-size:12.5px; color:var(--muted); line-height:1.5; border-bottom:1px solid var(--border);}
.fc-head strong{color:var(--navy);}
.hourly-strip{display:flex; gap:4px; overflow-x:auto; padding:12px 14px 4px; scrollbar-width:none;}
.hourly-strip::-webkit-scrollbar{display:none;}
.hcell{flex:0 0 auto; text-align:center; min-width:48px; padding:8px 2px; border-radius:12px;}
.hcell.now{background:var(--info-soft);}
.hcell .hc-time{font-size:11px; color:var(--muted); margin-bottom:8px; font-weight:600;}
.hcell.now .hc-time{color:var(--primary-dark);}
.hcell svg{width:19px; height:19px; color:var(--primary); margin-bottom:6px;}
.hcell .hc-temp{font-size:13.5px; font-weight:700; color:var(--navy);}
.hcell .hc-rain{font-size:10.5px; font-weight:600; color:var(--secondary); margin-top:4px; min-height:13px;}

/* Daily forecast (home) */
.day-list{padding:4px 18px;}
.day-row{border-bottom:1px solid var(--border);}
.day-row:last-child{border-bottom:none;}
.day-main{display:flex; align-items:center; gap:10px; padding:12px 0; width:100%; background:none; border:none; text-align:left; font:inherit; color:inherit;}
button.day-main{cursor:pointer;}
.day-main .dl-day{width:48px; font-size:13.5px; font-weight:700; color:var(--navy);}
.day-main svg.wx{width:20px; height:20px; color:var(--primary); flex:none;}
.day-main .dl-rain{font-size:11px; color:var(--secondary); font-weight:600; width:34px;}
.day-main .dl-min, .day-main .dl-max{font-size:12.5px; font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace; width:30px;}
.day-main .dl-min{color:var(--muted); text-align:right;}
.day-main .dl-max{color:var(--navy); font-weight:600;}
.range-track{flex:1; height:6px; border-radius:6px; background:var(--border); position:relative; min-width:50px;}
.range-fill{position:absolute; top:0; bottom:0; border-radius:6px; background:linear-gradient(90deg,var(--secondary),var(--warning));}
.range-now{position:absolute; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:#fff; border:2px solid var(--navy);}
.day-main .chev{width:14px; height:14px; color:var(--muted); flex:none; transition:transform .2s;}
.day-row.open .chev{transform:rotate(90deg);}
.day-detail{display:none; grid-template-columns:1fr 1fr; gap:10px 16px; padding:2px 0 14px 58px; font-size:12px; color:var(--muted);}
.day-row.open .day-detail{display:grid;}
.day-detail b{display:block; color:var(--navy); font-size:13px; margin-top:1px;}
.day-detail .dd-sum{grid-column:1 / -1; color:var(--text); font-size:12.5px;}

/* Suggestions summary on home */

/* Plan rows (suggestions) */
.plan-row{display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--border);}
.plan-row:first-child{padding-top:0;}
.plan-row:last-child{border-bottom:none; padding-bottom:0;}
.plan-row .notif-icon{background:var(--info-soft);}
.plan-row h4{margin:0 0 3px; font-size:13.5px; color:var(--navy);}
.plan-row p{margin:0; font-size:12.5px; color:#3B4A5E; line-height:1.5;}

.interest-tile.current{border-color:var(--primary); background:var(--info-soft);}

/* Locations */
.loc-row{display:flex; align-items:center; gap:12px; padding:15px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; cursor:pointer;}
.loc-row.active-loc{border-color:var(--primary); background:var(--info-soft);}
.loc-icon-chip{width:40px; height:40px; border-radius:11px; background:var(--info-soft); display:flex; align-items:center; justify-content:center; color:var(--primary); flex:none;}
.loc-icon-chip svg{width:19px; height:19px;}
.loc-row .lr-name{font-size:14px; font-weight:700; color:var(--navy);}
.loc-row .lr-sub{font-size:11.5px; color:var(--muted);}
.loc-row .lr-temp{margin-left:auto; font-size:16px; font-weight:800; font-family:'IBM Plex Mono','Noto Sans Devanagari',monospace; color:var(--navy);}
.add-loc-btn{
  width:100%; border:1.5px dashed var(--primary); background:var(--info-soft); color:var(--primary-dark);
  border-radius:var(--radius-md); padding:14px; font-size:13.5px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
}

/* Filter chips */
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{
  flex:0 0 auto; padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:600;
  background:var(--card); border:1px solid var(--border); color:var(--muted); cursor:pointer;
}
.filter-chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

/* Profile */
.profile-role-card{display:flex; align-items:center; gap:14px;}
.profile-icon-chip{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:none;}
.profile-icon-chip svg{width:24px; height:24px;}
.profile-row{display:flex; align-items:center; justify-content:space-between; padding:15px 0; border-bottom:1px solid var(--border); font-size:14px;}
.profile-row:last-child{border-bottom:none;}
.profile-row .pr-label{color:var(--navy); font-weight:600; display:flex; align-items:center; gap:10px;}
.profile-row .pr-label svg{width:18px; height:18px; color:var(--muted);}
.profile-row .pr-val{color:var(--muted); font-size:13px;}

.btn-block{width:100%; border:none; border-radius:var(--radius-sm); padding:14px; font-size:14px; font-weight:700; cursor:pointer;}
.btn-block.primary{background:var(--primary); color:#fff;}
.gps-btn{margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn-block.outline{background:var(--card); color:var(--primary-dark); border:1.5px solid var(--primary);}

.footnote{font-size:11px; line-height:1.7; color:var(--muted); padding:18px 2px 6px;}

.loading-screen, .error-screen{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:50px 32px; text-align:center; gap:14px; min-height:60vh;
}
.spinner{width:28px; height:28px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--primary); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-screen p{color:var(--muted); font-size:13.5px; margin:0;}
.error-screen h3{font-size:17px; margin:0 0 4px; color:var(--navy);}
.error-screen p{color:var(--muted); font-size:13.5px; margin:0 0 16px; max-width:32ch;}

.empty-state{text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px;}

/* ============ LANGUAGE SWITCH ============ */
.lang-switch{display:inline-flex; gap:4px; padding:4px; border-radius:100px; background:var(--card); border:1px solid var(--border);}
.lang-switch button{border:none; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:100px; cursor:pointer;}
.lang-switch button.active{background:var(--primary); color:#fff;}
.lang-switch button:focus-visible{outline:2px solid var(--primary); outline-offset:1px;}
.splash-lang{position:relative; z-index:2; margin-top:-40px; background:rgba(255,255,255,0.16); border-color:rgba(255,255,255,0.35);}
.splash-lang button{color:#fff;}
.splash-lang button.active{background:#fff; color:var(--primary-dark);}
.profile-lang{display:flex; width:100%;}
.profile-lang button{flex:1; padding:9px 6px;}

/* ============ SIGN-IN ============ */
#view-auth .screen-pad{padding-top:4px;}
.auth-fields{display:flex; flex-direction:column; gap:10px;}
.auth-fields .btn-block{margin-top:4px; border-radius:100px;}
.auth-note{font-size:12.5px; color:var(--muted); text-align:center; margin:14px 0 0;}
button:disabled{opacity:.6; cursor:default;}

/* Account card in profile */
.account-card{display:flex; align-items:center; gap:12px;}
.account-avatar{width:44px; height:44px; border-radius:50%; background:var(--info-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex:none; overflow:hidden;}
.account-avatar img{width:100%; height:100%; object-fit:cover;}
.account-avatar svg{width:22px; height:22px;}
.account-name{font-weight:700; color:var(--navy); font-size:14px; overflow-wrap:anywhere;}
.account-sub{font-size:12px; color:var(--muted); margin-top:2px;}
.btn-row{display:flex; gap:10px; margin-top:12px;}

@media (max-width:380px){
  .hero-temp{font-size:46px;}
  .ring-wrap{width:88px; height:88px;}
}
</style>

<div class="view" id="view-auth">

<!-- ===================== ONBOARDING ===================== -->
<div class="view" id="view-onboarding">

  </div>
  <div class="screen-pad">
    <div class="ob-title" data-i18n="obTitle"></div>
    <p class="ob-sub" data-i18n="obSub"></p>
    <div class="interest-grid" id="interest-grid"></div>
  </div>
</div>

<!-- ===================== LOCATION ===================== -->
<div class="view" id="view-location">
  <div class="top-back">
    <button class="circle-btn" id="back-to-role" data-i18n-aria="back"></button>
  </div>
  <div class="screen-pad" style="padding-top:6px;">

    <p class="loc-sub" data-i18n="locSub"></p>

    <div class="divider-row" data-i18n="or">or</div>
    <button class="btn-secondary-outline" id="manual-loc-btn" data-i18n="manualLoc"></button>
    <div id="manual-search-wrap" style="display:none; margin-top:16px;">
      <div class="search-input" style="padding:0; border:none;">
        <input type="text" class="search-input"  id="search-input" data-i18n-ph="searchPh" autocomplete="off">
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="status-msg" id="location-status"></div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div class="view" id="view-app">
  <div class="app-topbar">
    <div class="topbar-left">
      <button class="avatar-btn" id="open-profile" data-i18n-aria="ariaProfile" aria-haspopup="dialog"></button>
      <div class="greeting">
        <div class="hi" id="greet-hi">Good morning</div>
        <div class="place" id="greet-place"></div>

    <div class="topbar-actions">

    </div>
  </div>

  <div class="nav-screen active" id="screen-home"></div>
</div>

<div class="sheet-layer" id="sheet-profile" aria-hidden="true">

</div>

/* =======================================================================
   STATE
======================================================================= */
const state = {
  role: null,
  lat: null, lon: null, placeName: "",
  weather: null, aqi: null, marine: null, marineUnavailable:false,
  savedLocations: [], // {name, lat, lon}
  eventDayIndex: 0
};

const $ = (id) => document.getElementById(id);
function showView(id){
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  $(id).classList.add("active");
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =======================================================================
   ENVIRONMENT CHECK (sandboxed preview detection)
======================================================================= */
let inIframe = false;
try{ inIframe = window.self !== window.top; }catch(e){ inIframe = true; }
if(inIframe){
  const b = $("env-banner");
  b.textContent = t("envBanner");
  b.classList.add("show");
}

/* =======================================================================
   ICONS INTO STATIC CHROME (back button, nav bar, topbar refresh)
======================================================================= */
$("back-to-role").innerHTML = '<span style="display:inline-flex; transform:rotate(180deg);">' + icon("chevron") + '</span>';
$("auth-back").innerHTML = '<span style="display:inline-flex; transform:rotate(180deg);">' + icon("chevron") + '</span>';
$("ob-back").innerHTML = '<span style="display:inline-flex; transform:rotate(180deg);">' + icon("chevron") + '</span>';
$("app-refresh").innerHTML = icon("refresh");
$("open-profile").innerHTML = icon("user");
$("open-alerts").innerHTML = icon("bell");
document.querySelectorAll(".sheet-head [data-close]").forEach(b => { b.innerHTML = icon("close"); });

/* =======================================================================
   ONBOARDING — build interest grid
======================================================================= */
const grid = $("interest-grid");
function buildInterestGrid(){
  grid.innerHTML = ROLE_ORDER.map(key => {
    const r = ROLES[key];
    return '<button class="interest-tile' + (key === state.role ? ' current' : '') + '" data-role="' + key + '">' +
      '<div class="tile-icon-chip" style="background:' + r.chipSoft + '; color:' + r.chip + ';">' + icon(r.icon) + '</div>' +
      '<div class="t-label">' + roleLabel(key) + '</div>' +
      '<div class="t-desc">' + roleDesc(key) + '</div>' +
    '</button>';
  }).join("");
}

$("get-started-btn").addEventListener("click", () => openAuth("splash"));

grid.addEventListener("click", (e) => {
  const tile = e.target.closest(".interest-tile");
  if(!tile) return;
  state.role = tile.getAttribute("data-role");
  suggFilter = "all";
  saveProfile();
  // Location already known? Skip the location screen and reload for the new interest.
  if(state.lat != null){
    fetchAllData(state.lat, state.lon, state.placeName);
  } else {
    showView("view-location");
  }
});
function openInterestPicker(){
  const hasApp = state.weather != null;
  $("ob-back-wrap").style.display = hasApp ? "flex" : "none";
  buildInterestGrid();
  showView("view-onboarding");
}
$("ob-back").addEventListener("click", () => showView("view-app"));
$("back-to-role").addEventListener("click", () => {
  if(state.weather) showView("view-app"); else openInterestPicker();
});

$("manual-loc-btn").addEventListener("click", () => {
  const wrap = $("manual-search-wrap");
  wrap.style.display = wrap.style.display === "none" ? "block" : "none";
  if(wrap.style.display === "block") $("search-input").focus();

$("gps-btn").addEventListener("click", () => {
  const statusEl = $("location-status");
  statusEl.classList.remove("show");
  if(!("geolocation" in navigator)){
    statusEl.textContent = t("locNoSupport");
    statusEl.classList.add("show");
    return;
  }
  if(window.isSecureContext === false){
    statusEl.textContent = t("locSecure");
    statusEl.classList.add("show");
    return;
  }
  const btn = $("gps-btn");
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("locating");
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      let name = t("currentLocationName");
      try{ name = await reverseGeocode(lat, lon); }catch(e){}
      btn.disabled = false; btn.textContent = original;
      fetchAllData(lat, lon, name);
    },
    (err) => {
      btn.disabled = false; btn.textContent = original;
      let msg = t("locDefault");
      if(err){
        if(err.code === 1) msg = inIframe ? t("locIframe") : t("locDenied");
        else if(err.code === 2) msg = t("locUnavail");
        else if(err.code === 3) msg = t("locTimeout");
      }
      statusEl.textContent = msg;
      statusEl.classList.add("show");
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:300000 }
  );
});

async function reverseGeocode(lat, lon){
  const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=en");
  if(!res.ok) throw new Error("reverse geocode failed");
  const data = await res.json();
  const city = data.city || data.locality || data.principalSubdivision || t("yourArea");
  const region = data.principalSubdivision || data.countryName || "";
  return region && region !== city ? (city + ", " + region) : city;
}

let searchTimer = null;
$("search-input").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if(q.length < 2){ $("suggestions").classList.remove("show"); $("suggestions").innerHTML=""; return; }
  searchTimer = setTimeout(() => runSearch(q, "suggestions", (lat,lon,name) => fetchAllData(lat,lon,name)), 350);
});

async function runSearch(q, boxId, onSelect){
  const box = $(boxId);
  box.innerHTML = '<div class="suggestion-item" style="cursor:default; color:var(--muted);">' + t("searching") + '</div>';
  box.classList.add("show");
  try{
    const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=6&language=en&format=json";
    const res = await fetch(url);
    if(!res.ok) throw new Error("search failed");
    const data = await res.json();
    renderSuggestions(data.results || [], boxId, onSelect);
  }catch(e){
    console.error("search failed", e);
    const reason = inIframe ? t("searchFailIframe") : t("searchFail");
    box.innerHTML = '<div class="suggestion-item" style="cursor:default;">' + reason + '</div>';
  }
}
function renderSuggestions(results, boxId, onSelect){
  const box = $(boxId);
  if(!results.length){
    box.innerHTML = '<div class="suggestion-item" style="cursor:default; color:var(--muted);">' + t("noMatches") + '</div>';
    return;
  }
  box.innerHTML = results.map((r,i) => {
    const region = [r.admin1, r.country].filter(Boolean).join(", ");
    return '<div class="suggestion-item" data-idx="' + i + '"><div class="place">' + escapeHtml(r.name) + '</div><div class="region">' + escapeHtml(region) + '</div></div>';
  }).join("");
  box.querySelectorAll(".suggestion-item").forEach(item => {
    item.addEventListener("click", () => {
      const r = results[parseInt(item.getAttribute("data-idx"),10)];
      const region = [r.admin1, r.country].filter(Boolean).join(", ");
      const name = region ? (r.name + ", " + region) : r.name;
      box.classList.remove("show");
      onSelect(r.latitude, r.longitude, name);
    });
  });
}

async function fetchAllData(lat, lon, placeName){
  state.lat = lat; state.lon = lon; state.placeName = placeName || t("yourLocation");
  addToSavedLocations(state.placeName, lat, lon);
  saveProfile();
  showView("view-app");
  goNav("home");
  $("greet-place").innerHTML = icon("pin") + '<span>' + escapeHtml(state.placeName) + '</span>';
  $("screen-home").innerHTML = '<div class="loading-screen"><div class="spinner"></div><p>' + t("loadingSky", { place: escapeHtml(state.placeName) }) + '</p></div>';

  try{
    const tasks = [fetchWeather(lat, lon), fetchAirQuality(lat, lon)];
    if(state.role === "beach") tasks.push(fetchMarine(lat, lon));
    const results = await Promise.all(tasks);
    state.weather = results[0];
    state.aqi = results[1];
    if(state.role === "beach"){
      state.marine = results[2];
      state.marineUnavailable = !results[2];
    }
    renderAll();
  }catch(err){
    console.error(err);
    $("screen-home").innerHTML =
      '<div class="error-screen">' + icon("infocircle","","") +
      '<h3>' + t("errLoadTitle") + '</h3>' +
      '<p>' + t("errLoadMsg") + '</p>' +
      '<button class="btn-block primary" id="retry-btn" style="max-width:220px;">' + t("tryAgain") + '</button></div>';
    $("retry-btn").addEventListener("click", () => fetchAllData(lat, lon, placeName));
  }
}

function addToSavedLocations(name, lat, lon){
  const exists = state.savedLocations.find(l => Math.abs(l.lat-lat)<0.01 && Math.abs(l.lon-lon)<0.01);
  if(!exists) state.savedLocations.push({ name: name || t("locationWord"), lat, lon });
}

async function fetchWeather(lat, lon){
  const params = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day",
    hourly: "temperature_2m,precipitation_probability,visibility,soil_moisture_0_to_1cm,uv_index,wind_speed_10m,weather_code,is_day",
    daily: "sunrise,sunset,precipitation_probability_max,temperature_2m_max,temperature_2m_min,uv_index_max,weather_code,wind_speed_10m_max",
    timezone: "auto", forecast_days: "7"
  });
  const res = await fetch("https://api.open-meteo.com/v1/forecast?" + params.toString());
  if(!res.ok) throw new Error("weather fetch failed");
  return res.json();
}
async function fetchAirQuality(lat, lon){
  const params = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: "us_aqi,pm2_5,pm10",
    hourly: "european_aqi,alder_pollen,birch_pollen,grass_pollen,ragweed_pollen",
    timezone: "auto"
  });
  try{
    const res = await fetch("https://air-quality-api.open-meteo.com/v1/air-quality?" + params.toString());
    if(!res.ok) return null;
    return res.json();
  }catch(e){ return null; }
}
async function fetchMarine(lat, lon){
  const params = new URLSearchParams({
    latitude: lat, longitude: lon,
    current: "wave_height,wave_direction,wave_period,sea_surface_temperature",
    hourly: "wave_height,wind_wave_height,swell_wave_height",
    timezone: "auto"
  });
  try{
    const res = await fetch("https://marine-api.open-meteo.com/v1/marine?" + params.toString());
    if(!res.ok) return null;
    const data = await res.json();
    if(!data.current || data.current.wave_height == null) return null;
    return data;
  }catch(e){ return null; }
}

const WEATHER_CODES = {
  0:{desc:"Clear sky",icon:"sun"}, 1:{desc:"Mostly clear",icon:"cloudsun"}, 2:{desc:"Partly cloudy",icon:"cloudsun"}, 3:{desc:"Overcast",icon:"cloud"},
  45:{desc:"Fog",icon:"fog"}, 48:{desc:"Icy fog",icon:"fog"},
  51:{desc:"Light drizzle",icon:"cloudrain"}, 53:{desc:"Drizzle",icon:"cloudrain"}, 55:{desc:"Dense drizzle",icon:"cloudrain"},
  56:{desc:"Freezing drizzle",icon:"cloudrain"}, 57:{desc:"Freezing drizzle",icon:"cloudrain"},
  61:{desc:"Light rain",icon:"cloudrain"}, 63:{desc:"Rain",icon:"cloudrain"}, 65:{desc:"Heavy rain",icon:"cloudrain"},
  66:{desc:"Freezing rain",icon:"cloudrain"}, 67:{desc:"Freezing rain",icon:"cloudrain"},
  71:{desc:"Light snow",icon:"cloudsnow"}, 73:{desc:"Snow",icon:"cloudsnow"}, 75:{desc:"Heavy snow",icon:"cloudsnow"}, 77:{desc:"Snow grains",icon:"cloudsnow"},
  80:{desc:"Rain showers",icon:"cloudrain"}, 81:{desc:"Rain showers",icon:"cloudrain"}, 82:{desc:"Violent showers",icon:"cloudbolt"},
  85:{desc:"Snow showers",icon:"cloudsnow"}, 86:{desc:"Snow showers",icon:"cloudsnow"},
  95:{desc:"Thunderstorm",icon:"cloudbolt"}, 96:{desc:"Thunderstorm, hail",icon:"cloudbolt"}, 99:{desc:"Thunderstorm, hail",icon:"cloudbolt"}
};
function weatherInfo(code){
  const w = WEATHER_CODES[code] || {desc:"Unsettled", icon:"cloud"};
  const tr = WX_TR[LANG];
  return { desc: (tr && tr[w.desc]) || w.desc, icon: w.icon };
}
function aqiCategory(aqi){
  if(aqi == null) return {label:t("aqiNA"), tone:"info"};
  if(aqi <= 50) return {label:t("aqiGood"), tone:"good"};
  if(aqi <= 100) return {label:t("aqiModerate"), tone:"advisory"};
  if(aqi <= 150) return {label:t("aqiUSG"), tone:"advisory"};
  if(aqi <= 200) return {label:t("aqiUnhealthy"), tone:"warning"};
  if(aqi <= 300) return {label:t("aqiVery"), tone:"warning"};
  return {label:t("aqiHaz"), tone:"warning"};
}
function uvCategory(uv){
  if(uv == null) return {label:t("aqiNA"), tone:"info"};
  if(uv < 3) return {label:t("uvLow"), tone:"good"};
  if(uv < 6) return {label:t("uvModerate"), tone:"advisory"};
  if(uv < 8) return {label:t("uvHigh"), tone:"advisory"};
  if(uv < 11) return {label:t("uvVeryHigh"), tone:"warning"};
  return {label:t("uvExtreme"), tone:"warning"};
}
function formatClock(iso){
  if(!iso) return "—";
  const d = new Date(iso); let h = d.getHours(); const m = d.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM"; h = h % 12; if(h===0) h=12;
  return h + ":" + String(m).padStart(2,"0") + " " + ampm;
}
function formatHour(iso){
  const d = new Date(iso); let h = d.getHours(); const ampm = h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
  return h + ampm;
}
function dayLabel(iso, idx){
  if(idx===0) return t("today");
  return new Date(iso).toLocaleDateString(LOCALE[LANG],{weekday:"short"});
}
function findHourIndex(times, currentTime){
  if(!times || !times.length) return 0;
  let idx = times.indexOf(currentTime);
  if(idx !== -1) return idx;
  const now = new Date(currentTime || Date.now());
  idx = 0; let best = Infinity;
  times.forEach((t,i) => { const diff = Math.abs(new Date(t)-now); if(diff<best){best=diff; idx=i;} });
  return idx;
}

/* =======================================================================
   BUILD CONTEXT
======================================================================= */
function buildContext(){
  const w = state.weather; const cur = w.current, hourly = w.hourly, daily = w.daily;
  const hIdx = findHourIndex(hourly.time, cur.time);
  const aqiCur = (state.aqi && state.aqi.current) ? state.aqi.current : null;
  const aqiHourlyIdx = (state.aqi && state.aqi.hourly) ? findHourIndex(state.aqi.hourly.time, cur.time) : -1;
  let pollen = null;
  if(state.aqi && state.aqi.hourly && aqiHourlyIdx !== -1){
    const h = state.aqi.hourly;
    const vals = [h.grass_pollen, h.birch_pollen, h.alder_pollen, h.ragweed_pollen].map(a => a ? a[aqiHourlyIdx] : null).filter(v => v != null);
    if(vals.length) pollen = Math.max.apply(null, vals);
  }
  let marineCtx = null;
  if(state.marine && state.marine.current){
    marineCtx = {
      waveHeight: state.marine.current.wave_height,
      wavePeriod: state.marine.current.wave_period,
      waveDirection: state.marine.current.wave_direction,
      seaTemp: state.marine.current.sea_surface_temperature,
      hourlyTimes: state.marine.hourly ? state.marine.hourly.time : null,
      hourlyWave: state.marine.hourly ? state.marine.hourly.wave_height : null
    };
  }
  return {
    placeName: state.placeName,
    tempC: cur.temperature_2m, feelsLike: cur.apparent_temperature, humidity: cur.relative_humidity_2m,
    windKmh: cur.wind_speed_10m, weatherCode: cur.weather_code, isDay: cur.is_day===1, currentTime: cur.time,
    rainProbPct: hourly.precipitation_probability ? hourly.precipitation_probability[hIdx] : null,
    visibilityKm: hourly.visibility ? hourly.visibility[hIdx]/1000 : null,
    uvIndex: hourly.uv_index ? hourly.uv_index[hIdx] : (daily.uv_index_max ? daily.uv_index_max[0] : null),
    soilMoisture: hourly.soil_moisture_0_to_1cm ? hourly.soil_moisture_0_to_1cm[hIdx] : null,
    sunrise: daily.sunrise ? daily.sunrise[0] : null, sunset: daily.sunset ? daily.sunset[0] : null,
    tempMax: daily.temperature_2m_max ? daily.temperature_2m_max[0] : null,
    tempMin: daily.temperature_2m_min ? daily.temperature_2m_min[0] : null,
    aqi: aqiCur ? aqiCur.us_aqi : null, pm25: aqiCur ? aqiCur.pm2_5 : null, pollen: pollen,
    hourly: hourly, daily: daily, hIdx: hIdx, marine: marineCtx
  };
}

function computeFlags(ctx){
  return {
    heavyRain: ctx.rainProbPct!=null && ctx.rainProbPct>=70,
    moderateRain: ctx.rainProbPct!=null && ctx.rainProbPct>=40 && ctx.rainProbPct<70,
    lightRainChance: ctx.rainProbPct!=null && ctx.rainProbPct>=20 && ctx.rainProbPct<40,
    extremeHeat: ctx.feelsLike!=null && ctx.feelsLike>=39,
    hot: ctx.feelsLike!=null && ctx.feelsLike>=33 && ctx.feelsLike<39,
    cold: ctx.feelsLike!=null && ctx.feelsLike<=12,
    highWind: ctx.windKmh!=null && ctx.windKmh>=35,
    poorAQI: ctx.aqi!=null && ctx.aqi>=150,
    moderateAQI: ctx.aqi!=null && ctx.aqi>=100 && ctx.aqi<150,
    fairAQI: ctx.aqi!=null && ctx.aqi>=50 && ctx.aqi<100,
    goodAQI: ctx.aqi!=null && ctx.aqi<50,
    highUV: ctx.uvIndex!=null && ctx.uvIndex>=8,
    lowSoil: ctx.soilMoisture!=null && ctx.soilMoisture<0.15,
    highSoil: ctx.soilMoisture!=null && ctx.soilMoisture>=0.30,
    lowVisibility: ctx.visibilityKm!=null && ctx.visibilityKm<2,
    thunder: ctx.weatherCode===95 || ctx.weatherCode===96 || ctx.weatherCode===99,
    highWave: ctx.marine && ctx.marine.waveHeight!=null && ctx.marine.waveHeight>=2.2,
    flatSea: ctx.marine && ctx.marine.waveHeight!=null && ctx.marine.waveHeight<0.35
  };
}

function generateNotifications(role, ctx, flags){
  const list = [];
  function add(category){
    const table = (NOTIF_TR[LANG] && NOTIF_TR[LANG][category]) ? NOTIF_TR[LANG] : NOTIF;
    const tpl = (table[category] && table[category][role]) || (NOTIF[category] && NOTIF[category][role]);
    const enTag = CATEGORY_TAG[category];
    const tag = (TAG_TR[LANG] && TAG_TR[LANG][enTag]) || enTag;
    if(tpl) list.push({ level:CATEGORY_LEVEL[category], icon:CATEGORY_ICON[category], tag:tag, title:tpl.title, msg:tpl.msg });
  }
  if(flags.thunder) add("thunder");
  else if(flags.heavyRain) add("heavyRain");
  else if(flags.moderateRain) add("moderateRain");
  else if(flags.lightRainChance) add("lightRain");

  if(flags.extremeHeat) add("extremeHeat");
  else if(flags.hot) add("hot");
  else if(flags.cold) add("cold");

  if(flags.poorAQI) add("poorAQI");
  else if(flags.moderateAQI) add("moderateAQI");

  if(flags.highUV) add("highUV");
  if(flags.highWind) add("highWind");

  if(role === "farmer" && !flags.heavyRain && !flags.moderateRain){
    if(flags.lowSoil) add("farmerDrySoil");
    else if(flags.highSoil) add("farmerWetSoilGood");
  }
  if(role === "beach"){
    if(flags.highWave) add("highWave");
    else if(flags.flatSea) add("flatSea");
  }
  if(list.length === 0) add("niceDay");

  const order = { warning:0, advisory:1, info:2, good:3 };
  list.sort((a,b) => order[a.level]-order[b.level]);
  return list.slice(0, 6);
}

/* =======================================================================
   SCORING ENGINE
======================================================================= */
const RISK_FRAMED_ROLES = { health:1, parent:1, commuter:1, worker:1 };
const SCORE_LABEL = {
  fitness:"Outdoor Score", health:"Health Risk", farmer:"Field Conditions", student:"Campus Day Score",
  parent:"Family Risk", worker:"Outdoor Work Risk", traveler:"Trip Comfort Score", beach:"Surf & Swim Score",
  commuter:"Commute Risk", event:"Event Weather Score"
};

function computeFavorability(ctx, flags, role){
  let score = 100;
  if(flags.thunder) score -= 40;
  else if(flags.heavyRain) score -= 30;
  else if(flags.moderateRain) score -= 15;
  else if(flags.lightRainChance) score -= 5;
  if(flags.extremeHeat) score -= 25; else if(flags.hot) score -= 10;
  if(flags.cold) score -= 15;
  if(flags.poorAQI) score -= 25; else if(flags.moderateAQI) score -= 10;
  if(flags.highUV) score -= 10;
  if(flags.highWind) score -= 10;
  if(flags.lowVisibility) score -= 10;

  if(role === "farmer"){
    if(flags.lowSoil) score -= 8;
    if(flags.heavyRain && flags.highSoil) score -= 8;
  }
  if(role === "beach"){
    if(flags.highWave) score -= 25;
    if(flags.flatSea) score -= 8;
    if(ctx.marine == null) score -= 5;
  }
  if(role === "commuter"){
    if(flags.lowVisibility) score -= 10;
    if(flags.heavyRain) score -= 10;
  }
  return Math.max(4, Math.min(100, Math.round(score)));
}
function computeScore(role, ctx, flags){
  const fav = computeFavorability(ctx, flags, role);
  const isRisk = !!RISK_FRAMED_ROLES[role];
  const score = isRisk ? (100 - fav) : fav;
  let tone;
  if(isRisk){ tone = score <= 30 ? "success" : score <= 60 ? "warning" : "danger"; }
  else { tone = score >= 70 ? "success" : score >= 40 ? "warning" : "danger"; }
  let band;
  if(isRisk){ band = score<=30?t("bandLow"):score<=60?t("bandModerate"):score<=80?t("bandHigh"):t("bandSevere"); }
  else { band = score>=70?t("bandGood"):score>=40?t("bandFair"):t("bandPoor"); }
  const label = (SCORE_LABEL_TR[LANG] && SCORE_LABEL_TR[LANG][role]) || SCORE_LABEL[role];
  return { score, tone, band, label, isRisk };
}

function genericChipStatus(flags){
  if(flags.thunder || flags.heavyRain || flags.extremeHeat || flags.poorAQI) return "avoid";
  if(flags.moderateRain || flags.hot || flags.moderateAQI || flags.highWind || flags.highUV || flags.cold) return "caution";

}

  const labels = (CHIPS_TR[LANG] && CHIPS_TR[LANG][role]) || ROLE_CHIPS[role] || ["Outdoors","Activity","Plans"];
  const base = genericChipStatus(flags);
  if(role === "farmer"){

    return [
      { label:labels[0], status: base },
      { label:labels[1], status: (flags.highWind||flags.heavyRain||flags.moderateRain) ? "avoid" : "good" },
      { label: t("irrigation"), status: irrStatus }
    ];
  }
  return labels.map(l => ({ label:l, status: base }));
}

/* =======================================================================
   GAUGES (SVG arc speedometer)
======================================================================= */
function polar(cx,cy,r,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
}
function arcPath(cx,cy,r,startAngle,endAngle){
  const s = polar(cx,cy,r,startAngle), e = polar(cx,cy,r,endAngle);
  const large = (startAngle-endAngle) > 180 ? 1 : 0;
  return "M " + s.x + " " + s.y + " A " + r + " " + r + " 0 " + large + " 1 " + e.x + " " + e.y;
}
function valueToAngle(v, min, max){
  const t = Math.max(0, Math.min(1, (v-min)/(max-min)));
  return 180 - t*180;
}
function buildArcGauge(value, min, max, bands, unit, minLabel, maxLabel, title, statusLabel, toneColorVar){
  const cx=85, cy=80, r=64, sw=13;
  let segs = "";
  let prevAngle = 180;
  bands.forEach(b => {
    const ang = valueToAngle(b.upto, min, max);
    segs += '<path d="' + arcPath(cx,cy,r,prevAngle,ang) + '" fill="none" stroke="' + b.color + '" stroke-width="' + sw + '" stroke-linecap="butt"/>';
    prevAngle = ang;
  });
  const needleAngle = value == null ? 90 : valueToAngle(value, min, max);
  const tip = polar(cx,cy,r-20,needleAngle);
  const needle = value == null ? "" :
    '<line x1="' + cx + '" y1="' + cy + '" x2="' + tip.x + '" y2="' + tip.y + '" stroke="var(--navy)" stroke-width="2.6" stroke-linecap="round"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="var(--navy)"/>';
  const svg = '<svg viewBox="0 0 170 96" width="100%">' + segs + needle + '</svg>';
  const valText = value == null ? "—" : Math.round(value);
  return (
    '<div class="gauge-card">' +
      '<div class="gauge-title">' + title + '</div>' +
      '<div class="gauge-svg-wrap">' + svg +
        '<div class="gauge-readout"><div class="gv">' + valText + (unit ? '<span style="font-size:11px; font-weight:600;">' + unit + '</span>' : '') + '</div>' +
        '<div class="gl" style="color:' + toneColorVar + ';">' + statusLabel + '</div></div>' +
      '</div>' +
      '<div class="gauge-minmax"><span>' + minLabel + '</span><span>' + maxLabel + '</span></div>' +
    '</div>'
  );
}
function ringGauge(score, tone){
  const size=104, r=44, sw=10, cx=size/2, cy=size/2;
  const circ = 2*Math.PI*r;
  const pct = Math.max(0,Math.min(100,score))/100;
  const offset = circ*(1-pct);
  const colorMap = { success:"var(--success)", warning:"var(--warning)", danger:"var(--danger)" };
  return (
    '<div class="ring-wrap">' +
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="' + sw + '"/>' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + colorMap[tone] + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '"/>' +
      '</svg>' +
      '<div class="ring-center"><div class="rv">' + score + '<small>/100</small></div></div>' +
    '</div>'
  );
}

/* Bell badge in the top-right: counts alerts that need attention. */
function updateBell(){
  const btn = $("open-alerts");
  if(!btn || !state.weather) return;
  const ctx = buildContext();
  const alerts = generateNotifications(state.role, ctx, computeFlags(ctx));
  const warnings = alerts.filter(a => a.level==="warning").length;
  const serious = warnings + alerts.filter(a => a.level==="advisory").length;
  const old = btn.querySelector(".bell-badge");
  if(old) old.remove();
  if(serious){
    btn.insertAdjacentHTML("beforeend", '<span class="bell-badge' + (warnings ? '' : ' advisory') + '">' + (serious > 9 ? "9+" : serious) + '</span>');
    btn.setAttribute("aria-label", t("ariaAlertsN", { n: serious }));
  } else {
    btn.setAttribute("aria-label", t("ariaAlerts"));
  }
}

function hourIcon(code, isDay){
  const ic = weatherInfo(code).icon;
  if(isDay === 0 && (ic === "sun" || ic === "cloudsun")) return "moon";
  return ic;
}

function hourlyForecastHtml(ctx){
  const h = ctx.hourly;
  const times = h.time, temp = h.temperature_2m, rain = h.precipitation_probability || [];
  const codes = h.weather_code || [], isDay = h.is_day || [];
  const end = Math.min(times.length, ctx.hIdx + 24);

  // One-line read of the next 24 hours
  let firstRain = -1, peakRain = 0;
  for(let i=ctx.hIdx;i<end;i++){
    if(rain[i] >= 50 && firstRain === -1) firstRain = i;
    if(rain[i] > peakRain) peakRain = rain[i];
  }
  let hi = -Infinity, hiIdx = ctx.hIdx;
  for(let i=ctx.hIdx;i<end;i++){ if(temp[i] > hi){ hi = temp[i]; hiIdx = i; } }
  let summary;
  if(firstRain === ctx.hIdx) summary = t("rainNow", { p: Math.round(peakRain) });
  else if(firstRain !== -1) summary = t("rainFrom", { h: formatHour(times[firstRain]), p: Math.round(peakRain) });
  else summary = t("noRain");
  summary += t("warmest", { h: formatHour(times[hiIdx]), t: Math.round(hi) });

  let cells = "";
  for(let i=ctx.hIdx;i<end;i++){
    const isNow = i === ctx.hIdx;
    const code = isNow ? ctx.weatherCode : codes[i];
    const r = rain[i];
    cells += '<div class="hcell' + (isNow ? " now" : "") + '">' +
      '<div class="hc-time">' + (isNow ? t("now") : formatHour(times[i])) + '</div>' +
      icon(hourIcon(code, isNow ? (ctx.isDay?1:0) : isDay[i])) +
      '<div class="hc-temp">' + Math.round(temp[i]) + '&deg;</div>' +
      '<div class="hc-rain">' + (r != null && r >= 20 ? Math.round(r) + '%' : '') + '</div>' +
    '</div>';
  }
  return '<div class="card fc-card"><div class="fc-head">' + summary + '</div><div class="hourly-strip">' + cells + '</div></div>';
}

function dailyForecastHtml(ctx){
  const d = ctx.daily;
  if(!d || !d.time) return "";
  const lo = Math.min.apply(null, d.temperature_2m_min);
  const hi = Math.max.apply(null, d.temperature_2m_max);
  const span = Math.max(1, hi - lo);
  const pct = v => ((v - lo) / span) * 100;

  const rows = d.time.map((day,i) => {
    const fi = weatherInfo(d.weather_code[i]);
    const tmin = d.temperature_2m_min[i], tmax = d.temperature_2m_max[i];
    const left = pct(tmin), width = Math.max(4, pct(tmax) - left);
    const nowDot = (i === 0 && ctx.tempC != null)
      ? '<span class="range-now" style="left:' + Math.max(0, Math.min(100, pct(ctx.tempC))) + '%;"></span>' : '';
    const rainTxt = d.precipitation_probability_max[i] >= 10 ? Math.round(d.precipitation_probability_max[i]) + '%' : '';
    const inner =
      '<span class="dl-day">' + dayLabel(day,i) + '</span>' +
      icon(fi.icon, "wx") +
      '<span class="dl-rain">' + rainTxt + '</span>' +
      '<span class="dl-min">' + Math.round(tmin) + '&deg;</span>' +
      '<span class="range-track"><span class="range-fill" style="left:' + left + '%; width:' + width + '%;"></span>' + nowDot + '</span>' +
      '<span class="dl-max">' + Math.round(tmax) + '&deg;</span>';

    // Today's details are already on this page — only future days expand.
    if(i === 0) return '<div class="day-row"><div class="day-main">' + inner + '<span style="width:14px;"></span></div></div>';

    const uv = d.uv_index_max ? d.uv_index_max[i] : null;
    const wind = d.wind_speed_10m_max ? d.wind_speed_10m_max[i] : null;
    return '<div class="day-row">' +
      '<button class="day-main" aria-expanded="false">' + inner + icon("chevron","chev") + '</button>' +
      '<div class="day-detail">' +
        '<div class="dd-sum">' + t("dayRange", { desc: fi.desc, min: Math.round(tmin), max: Math.round(tmax) }) + '</div>' +
        '<div>' + t("rainChance") + '<b>' + Math.round(d.precipitation_probability_max[i]) + '%</b></div>' +
        '<div>' + t("maxWind") + '<b>' + (wind!=null ? Math.round(wind) + ' km/h' : '—') + '</b></div>' +
        '<div>' + t("maxUv") + '<b>' + (uv!=null ? Math.round(uv) + ' (' + uvCategory(uv).label + ')' : '—') + '</b></div>' +
        '<div>' + t("sunriseSunset") + '<b>' + formatClock(d.sunrise[i]) + ' / ' + formatClock(d.sunset[i]) + '</b></div>' +
      '</div>' +
    '</div>';
  }).join("");
  return '<div class="card" style="padding:4px 0;"><div class="day-list">' + rows + '</div></div>';
}

/* Role tiles on Home — only readings that aren't already shown in the hero, gauges or forecast. */
function rainNext3h(ctx){
  const r = ctx.hourly.precipitation_probability;
  if(!r) return null;
  let m = 0;
  for(let i=ctx.hIdx;i<Math.min(r.length, ctx.hIdx+3);i++) m = Math.max(m, r[i]);
  return m;
}

    pollen:  () => tile("leaf",t("pollen"), ctx.pollen!=null?Math.round(ctx.pollen):"—", ctx.pollen!=null?"grains/m³":"", ctx.pollen==null?t("notAvailRegion"):(ctx.pollen>40?t("high"):ctx.pollen>10?t("bandModerate"):t("low"))),
    soil:    () => tile("drophalf",t("soilMoisture"), ctx.soilMoisture!=null?Math.round(ctx.soilMoisture*100):"—", ctx.soilMoisture!=null?"%":"", ctx.soilMoisture==null?t("notAvailHere"):(flags.highSoil?t("high"):flags.lowSoil?t("low"):t("normal"))),

    seatemp: () => tile("droplet",t("seaTemp"), ctx.marine && ctx.marine.seaTemp!=null?Math.round(ctx.marine.seaTemp):"—","°C",""),
    period:  () => tile("activity",t("wavePeriod"), ctx.marine && ctx.marine.wavePeriod!=null?Math.round(ctx.marine.wavePeriod):"—","s","")
  };

function findBestActiveHour(ctx){
  const times = ctx.hourly.time, temp = ctx.hourly.temperature_2m, uv = ctx.hourly.uv_index, rain = ctx.hourly.precipitation_probability;
  if(!times) return "6:00–8:00 AM";
  let bestIdx = ctx.hIdx, bestScore = -Infinity;
  const end = Math.min(times.length, ctx.hIdx + 16);
  for(let i=ctx.hIdx;i<end;i++){
    const hr = new Date(times[i]).getHours();
    if(hr < 5 || hr > 20) continue;
    const s = -Math.abs((temp?temp[i]:24)-20) - (uv?uv[i]:0)*1.5 - (rain?rain[i]:0)*0.4;
    if(s > bestScore){ bestScore = s; bestIdx = i; }
  }
  return formatHour(times[bestIdx]);
}
function findBestSurfHour(ctx){
  if(!ctx.marine || !ctx.marine.hourlyTimes) return t("checkBackSurf");
  const times = ctx.marine.hourlyTimes, wave = ctx.marine.hourlyWave;
  let bestIdx = 0, bestScore = -Infinity;
  const nowIdx = findHourIndex(times, ctx.currentTime);
  const end = Math.min(times.length, nowIdx + 16);
  for(let i=nowIdx;i<end;i++){
    const w = wave ? wave[i] : null;
    if(w == null) continue;
    const s = -Math.abs(w - 1.2);
    if(s > bestScore){ bestScore = s; bestIdx = i; }
  }
  return formatHour(times[bestIdx]);
}
function findDepartureAdvice(ctx){
  const times = ctx.hourly.time, rain = ctx.hourly.precipitation_probability;
  if(!times || !rain) return t("depNoTiming");
  const end = Math.min(times.length, ctx.hIdx + 12);
  for(let i=ctx.hIdx;i<end;i++){
    if(rain[i] >= 60){
      return t("depRain", { h: formatHour(times[i]) });
    }
  }
  return t("depNone");
}
function packingSuggestionHtml(flags){
  const items = [];
  if(flags.heavyRain || flags.moderateRain || flags.lightRainChance) items.push({icon:"umbrella", label:t("umbrella")});

/* ---------------- SUGGESTIONS (alerts + advice) ---------------- */
let suggFilter = "all";

function dayComfort(d, i){
  const rain = d.precipitation_probability_max[i];
  const tmax = d.temperature_2m_max[i], tmin = d.temperature_2m_min[i];
  const wind = d.wind_speed_10m_max ? d.wind_speed_10m_max[i] : 0;
  const uv = d.uv_index_max ? d.uv_index_max[i] : 0;
  return Math.max(5, Math.min(100, Math.round(100 - rain*0.5 - Math.abs(((tmax+tmin)/2)-24)*3 - (wind>25?15:0) - (uv>=8?10:0))));
}

function roleTipText(role, ctx, flags){
  const rainy = flags.heavyRain || flags.moderateRain || flags.thunder;
  switch(role){
    case "health": return (flags.poorAQI||flags.moderateAQI) ? t("tipHealthAqi") : t("tipHealthOk");
    case "fitness": return rainy ? t("tipFitRain") : (flags.hot||flags.extremeHeat) ? t("tipFitHot") : t("tipFitOk");
    case "farmer": return (flags.lowSoil && !rainy) ? t("tipFarmIrr") : flags.highSoil ? t("tipFarmSkip") : t("tipFarmMon");
    case "commuter": return findDepartureAdvice(ctx) + t("trafficNote");
    case "parent": return flags.heavyRain ? t("tipParentRain") : t("tipParentOk");
    case "student": return rainy ? t("tipStudentRain") : t("tipStudentOk");
    case "worker": return (flags.hot||flags.extremeHeat) ? t("tipWorkerHot") : flags.highWind ? t("tipWorkerWind") : t("tipWorkerOk");
    case "traveler": return rainy ? t("tipTravRain") : t("tipTravOk");
    case "beach": return ctx.marine ? t("tipBeachMarine") : t("tipBeachNo");
    case "event": return rainy ? t("tipEventRain") : t("tipEventOk");
  }
  return "";
}

function renderSuggestionsTab(){
  const ctx = buildContext();
  const flags = computeFlags(ctx);
  const role = state.role;
  const all = generateNotifications(role, ctx, flags);
  const cats = ["all", ...Array.from(new Set(all.map(n=>n.tag)))];
  if(!cats.includes(suggFilter)) suggFilter = "all";
  const filtered = suggFilter==="all" ? all : all.filter(n => n.tag===suggFilter);
  const chips = computeChips(role, ctx, flags);

  // Best time today
  let bestTitle, bestText;
  if(role === "beach"){
    bestTitle = t("bestTimeWater");
    bestText = ctx.marine ? t("aroundSurf", { h: findBestSurfHour(ctx) }) : t("needsSea");
  } else {
    bestTitle = role === "farmer" ? t("bestTimeField") : role === "fitness" ? t("bestTimeTrain") : t("bestTimeOut");
    bestText = t("aroundActive", { h: findBestActiveHour(ctx) });
  }

  // Best day this week
  const d = ctx.daily;
  let bestDay = 1, bestVal = -1;
  for(let i=1;i<d.time.length;i++){ const c = dayComfort(d,i); if(c > bestVal){ bestVal = c; bestDay = i; } }
  const purposes = PURPOSE_TR[LANG] || PURPOSE_TR.en;
  const bestDayText = t("bestDayText", {
    day: new Date(d.time[bestDay]).toLocaleDateString(LOCALE[LANG],{weekday:"long"}),
    purpose: purposes[role] || purposes._,
    v: bestVal
  });

  const planRow = (ic, title, text) =>
    '<div class="plan-row"><div class="notif-icon">' + icon(ic) + '</div><div><h4>' + title + '</h4><p>' + text + '</p></div></div>';

  $("screen-suggestions").innerHTML =
    '<div class="section-title">' + t("alertsTitle") + '</div>' +
    (cats.length > 2 ? '<div class="filter-row">' + cats.map(c => '<button class="filter-chip ' + (c===suggFilter?"active":"") + '" data-cat="' + c + '">' + (c==="all"?t("all"):c) + '</button>').join("") + '</div>' : '') +
    (filtered.length ? filtered.map(notifCardHtml).join("") : '<div class="empty-state">' + t("noAlertsCat") + '</div>') +
    '<div class="section-title">' + t("rightNow") + '</div>' +
    '<div class="card"><div class="chip-row" style="margin-top:0;">' + chips.map(chipHtml).join("") + '</div></div>' +
    '<div class="section-title">' + t("planDay") + '</div>' +
    '<div class="card">' +
      planRow("clock", bestTitle, bestText) +
      planRow("calendarstar", t("bestDayWeek"), bestDayText) +
      planRow("bulb", t("tipForYou"), roleTipText(role, ctx, flags)) +
    '</div>' +
    (role === "event" ? '<div class="section-title">' + t("eventDateCheck") + '</div>' + eventPlannerHtml(ctx) : '') +
    '<div class="section-title">' + t("whatToCarry") + '</div>' + packingSuggestionHtml(flags) +
    '<div class="footnote">' + t("suggFoot") + '</div>';

  $("screen-suggestions").querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", () => { suggFilter = chip.getAttribute("data-cat"); renderSuggestionsTab(); });
  });
  if(role === "event") renderEventDayResult();
}

   LOGIN + SAVING (this phone only)
   Name, interest, places and language are saved in this browser.
   Nothing goes to a server. Log out clears it.

const STORE_KEY = "mausam:profile";
const LANG_KEY = "mausam:lang";
const session = { name:"" };
let authReturnTo = "splash";

function loadLocal(){
  try{ const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearLocal(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

function profileData(){
  return {
    name: session.name,
    role: state.role, lat: state.lat, lon: state.lon, placeName: state.placeName || "",
    savedLocations: state.savedLocations.map(l => ({ name:l.name, lat:l.lat, lon:l.lon })),
    lang: LANG
  };
}
function saveProfile(){
  if(!session.name) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(profileData())); }catch(e){}
}
function applyProfile(p){
  session.name = p.name || "";
  state.role = p.role || null;
  state.lat = (p.lat != null) ? p.lat : null;
  state.lon = (p.lon != null) ? p.lon : null;
  state.placeName = p.placeName || "";
  state.savedLocations = Array.isArray(p.savedLocations) ? p.savedLocations.slice() : [];
}
function hasSetup(p){ return p && p.role && ROLES[p.role] && p.lat != null && p.lon != null; }
function resetState(){
  session.name = "";
  state.role = null; state.lat = null; state.lon = null; state.placeName = "";
  state.weather = null; state.aqi = null; state.marine = null; state.marineUnavailable = false;
  state.savedLocations = [];
}

/* ---------------- LANGUAGE ---------------- */
function applyStaticI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.setAttribute("placeholder", t(el.getAttribute("data-i18n-ph"))); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
  document.querySelectorAll(".lang-switch button").forEach(b => {
    const on = b.getAttribute("data-lang") === LANG;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  if(inIframe) $("env-banner").textContent = t("envBanner");
}
function setLang(l, opts){
  if(LANGS.indexOf(l) === -1) l = "en";
  LANG = l;
  document.documentElement.lang = l;
  try{ localStorage.setItem(LANG_KEY, l); }catch(e){}
  suggFilter = "all";
  applyStaticI18n();
  buildInterestGrid();
  if(state.weather) renderAll();
  if(!(opts && opts.noSave)) saveProfile();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest ? e.target.closest(".lang-switch button") : null;
  if(b) setLang(b.getAttribute("data-lang"));
});

/* ---------------- LOGIN SCREEN ---------------- */
function openAuth(returnTo){
  authReturnTo = returnTo || "splash";
  $("auth-status").classList.remove("show");
  $("auth-name").value = session.name || "";
  showView("view-auth");
  setTimeout(() => $("auth-name").focus(), 50);
}
function loginSubmit(){
  const name = $("auth-name").value.trim().replace(/\s+/g, " ").slice(0, 40);
  if(!name){
    $("auth-status").textContent = t("errName");
    $("auth-status").classList.add("show");
    return;
  }
  session.name = name;
  saveProfile();
  if(hasSetup(profileData())){
    showView("view-app");
    if(state.weather) renderAll(); else fetchAllData(state.lat, state.lon, state.placeName);
  } else {
    openInterestPicker();
  }
}
$("auth-back").addEventListener("click", () => showView("view-splash"));
$("login-btn").addEventListener("click", loginSubmit);
$("auth-name").addEventListener("keydown", (e) => { if(e.key === "Enter") loginSubmit(); });
$("auth-name").addEventListener("input", () => $("auth-status").classList.remove("show"));

function logOut(){
  if(!window.confirm(t("confirmLogout"))) return;
  closeSheets(true);
  clearLocal(); resetState();
  showView("view-splash");
}

/* ---------------- START-UP ---------------- */
function boot(){
  const local = loadLocal();
  let lang = "en";
  try{ lang = (local && local.lang) || localStorage.getItem(LANG_KEY) || "en"; }catch(e){}
  setLang(lang, { noSave:true });
  if(!local || !local.name) return;          // not logged in → splash
  applyProfile(local);
  if(hasSetup(local)) fetchAllData(state.lat, state.lon, state.placeName);
  else if(state.role) showView("view-location");
  else openInterestPicker();
}

boot();

})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
